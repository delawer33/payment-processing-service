global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]

  - job_name: consumer
    static_configs:
      - targets: ["consumer:9100"]

  # Встроенный плагин rabbitmq_prometheus; per-object — метрики по каждой очереди
  # (глубина payments.new, payments.retry, payments.dlq).
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]
