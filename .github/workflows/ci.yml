name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # whole history: a secret in an old commit is still a leak
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --locked: fail if uv.lock is out of date with pyproject.toml instead of silently re-resolving.
      - run: uv sync --locked
      - name: ruff (lint)
        run: uv run ruff check .
      - name: ruff (format)
        run: uv run ruff format --check .
      - name: mypy --strict
        run: uv run mypy
      - name: pytest
        # testcontainers поднимает Postgres через Docker, который есть на ubuntu-latest.
        run: uv run pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The checks above run tooling on the host; a broken Dockerfile or compose file would
      # otherwise surface only for whoever first boots the stack.
      - name: .env from example
        run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose --profile demo config -q
      - run: docker compose build
