# Несекретная конфигурация; всё, что не задано, берёт дефолты из config.py.
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-processing
data:
  ENVIRONMENT: prod
  LOG_LEVEL: INFO
  API_PORT_INTERNAL: "8000"
  CONSUMER_METRICS_PORT: "9100"
  CONSUMER_PREFETCH: "10"
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW: "1"
  # Бюджет соединений Postgres (max_connections 100): 6 подов api (максимум HPA) × (5 + 5)
  # и 2 consumer × 12 (переопределено в consumer.yaml) — 84.
  DB_POOL_SIZE: "5"
  DB_MAX_OVERFLOW: "5"
