# Схему применяет Job (ADR 0005). api и consumer ждут её в init-контейнере, поэтому всё
# применяется одним `kubectl apply -k`. Шаблон Job неизменяем: перед выкаткой новой версии
# старую Job удаляют (`kubectl delete job migrate`), см. README.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: migrate
          image: payment-processing:local
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: payment-processing
            - secretRef:
                name: payment-processing
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
