services:
  api:
    container_name: payment-processing_api
    build: .
    image: payment-processing:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT_INTERNAL}/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:${RABBITMQ_PORT_INTERNAL}/
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT_EXTERNAL}:${API_PORT_INTERNAL}"
    networks:
      - app_network
    healthcheck:
      # $$ — подстановку делает оболочка контейнера из его окружения, а не compose из оболочки хоста.
      test: ["CMD-SHELL", "curl -fs -H \"X-API-Key: $$API_KEY\" http://localhost:$$API_PORT_INTERNAL/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  consumer:
    container_name: payment-processing_consumer
    build: .
    image: payment-processing:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT_INTERNAL}/${POSTGRES_DB}
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:${RABBITMQ_PORT_INTERNAL}/
    # Same image as the API; only the entrypoint differs.
    command: ["faststream", "run", "payment_processing.consumer.app:app"]
    depends_on:
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - app_network

  # Одноразовый сервис: применяет схему и завершается (ADR 0005). api и consumer ждут его успеха.
  migrate:
    container_name: payment-processing_migrate
    build: .
    image: payment-processing:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT_INTERNAL}/${POSTGRES_DB}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  # Приёмник webhook для демо: `docker compose --profile demo up`.
  webhook-sink:
    container_name: payment-processing_webhook-sink
    profiles: ["demo"]
    image: python:3.13-slim
    environment:
      WEBHOOK_SINK_FAIL_FIRST: ${WEBHOOK_SINK_FAIL_FIRST:-0}
    command: ["python", "/app/webhook_sink.py"]
    volumes:
      - ./scripts/webhook_sink.py:/app/webhook_sink.py:ro
    networks:
      - app_network

  rabbitmq:
    container_name: payment-processing_rabbitmq
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT_EXTERNAL}:${RABBITMQ_PORT_INTERNAL}"
      - "${RABBITMQ_MANAGEMENT_PORT_EXTERNAL}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10

  db:
    container_name: payment-processing_db
    image: postgres:17
    env_file: .env
    ports:
      - "${POSTGRES_PORT_EXTERNAL}:${POSTGRES_PORT_INTERNAL}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
